    <filter id="glow1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow3" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="22" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g id="cadre-mineure" filter="url(#shadow)"><polygon points="512,72 952,512 512,952 72,512" fill="none" stroke="url(#metal)" stroke-width="22" stroke-linejoin="round"/><polygon points="512,72 952,512 512,952 72,512" fill="none" stroke="#32deec" stroke-opacity=".48" stroke-width="4" stroke-linejoin="round"/></g>
  <g id="embleme-inspiration" filter="url(#shadow)">
