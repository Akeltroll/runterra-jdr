<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Rune Inspiration — Mineure</title>
  <desc id="desc">Icône vectorielle transparente pour arbre de runes RPG, rang mineure.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a4"/><stop offset=".28" stop-color="#d29625"/><stop offset=".58" stop-color="#6d3d08"/><stop offset=".82" stop-color="#d29625"/><stop offset="1" stop-color="#fff0a4"/></linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#fff0a4"/><stop offset=".16" stop-color="#d29625"/><stop offset=".55" stop-color="#6d3d08"/><stop offset="1" stop-color="#05070a"/></linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".34" stop-color="#fff0a4"/><stop offset=".68" stop-color="#32deec"/><stop offset="1" stop-color="#d29625"/></linearGradient>
    <radialGradient id="core" cx="38%" cy="34%"><stop offset="0" stop-color="#ffffff"/><stop offset=".30" stop-color="#8ff7ff"/><stop offset=".66" stop-color="#54d9ef"/><stop offset=".84" stop-color="#cf9eff"/><stop offset="1" stop-color="#529bdc"/></radialGradient>
