    <ellipse cx="512" cy="512" rx="230" ry="92" fill="none" stroke="url(#metal)" stroke-width="38" transform="rotate(60 512 512)"/>
    <ellipse cx="512" cy="512" rx="230" ry="92" fill="none" stroke="url(#metal)" stroke-width="38" transform="rotate(-60 512 512)"/>
